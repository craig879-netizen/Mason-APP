name: Simulators (iOS 15 – 26)

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: simulators-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC"; fi
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build universal simulator app (arm64 + x86_64, iOS 13+)
        run: |
          set -o pipefail
          xcodebuild -project Mason.xcodeproj -scheme Mason -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build ONLY_ACTIVE_ARCH=NO ARCHS="arm64 x86_64" \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
          ditto -c -k --sequesterRsrc --keepParent \
            build/Build/Products/Debug-iphonesimulator/Mason.app Mason-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Mason-simulator-app
          path: Mason-simulator.zip

  simulate:
    needs: build
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # iOS 13 and 14 simulators cannot run here: Apple blocks iOS 13 on macOS newer
        # than 12 and iOS 14.5 on macOS newer than 13.3, and GitHub has no Macs that old.
        include:
          - { label: iPad-iPadOS-15,            os: "15.5", device: "iPad Pro (11-inch) (3rd generation)", family: iPad, runner: macos-15-intel }
          - { label: iPad-iPadOS-16,            os: "16.4", device: "iPad Pro (11-inch) (4th generation)", family: iPad, runner: macos-26 }
          - { label: iPad-iPadOS-17,            os: "17.5", device: "iPad Pro (11-inch) (4th generation)", family: iPad, runner: macos-26 }
          - { label: iPad-iPadOS-18,            os: "18.6", device: "iPad Pro 11-inch (M4)", family: iPad, runner: macos-26 }
          - { label: iPhone-17-Pro-iOS-26,      os: "26",   device: "iPhone 17 Pro", family: iPhone, runner: macos-26 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: Mason-simulator-app

      - name: Show runner
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Create simulator
        run: |
          chmod +x .github/scripts/*.sh
          UDID=$(.github/scripts/prepare_simulator.sh "${{ matrix.os }}" "${{ matrix.device }}" "${{ matrix.family }}")
          echo "UDID=$UDID" >> "$GITHUB_ENV"

      - name: Run Mason and take screenshots
        run: |
          ditto -x -k Mason-simulator.zip app
          .github/scripts/run_in_simulator.sh "$UDID" app/Mason.app "shots/${{ matrix.label }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.label }}
          path: shots
          if-no-files-found: ignore
